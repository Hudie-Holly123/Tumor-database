name: Verify and update cancer resources

on:
  schedule:
    # Run automatically every Monday
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Rebuild curated website data from Excel
        run: python scripts/build_data.py Cancer_Data_Resource_Master_Directory_Clean_Standardized_2026.xlsx data/resources.json

      - name: Verify official resource websites
        run: python scripts/verify_dynamic.py data/resources.json data/evidence.json data/review_queue.json data/resources_live.json

      - name: Build updated website data
        run: python scripts/merge_live_verification.py data/resources.json data/resources_live.json data/resources.js

      - name: Discover new NAR cancer resource candidates
        continue-on-error: true
        run: python scripts/discover_nar_candidates.py data/nar_candidates.json

      - name: Commit updated verification data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/resources.json data/resources.js data/resources_live.json data/evidence.json data/review_queue.json data/nar_candidates.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: verify official cancer resource sources"
          git push
